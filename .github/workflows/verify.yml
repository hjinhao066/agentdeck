name: Verify and package both platforms
# Throwaway diagnostic run: which prompt lengths does the real Codex TUI submit on Windows?
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable Git CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install -g @openai/codex @anthropic-ai/claude-code
      - name: Codex ladder
        env:
          AGENTDECK_REAL_CLI: codex
        run: npx playwright test tests/e2e/zz-codex-ladder.spec.js
