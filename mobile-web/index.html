<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>AgentDeck</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <button id="back" class="icon-button" type="button" title="返回会话列表" aria-label="返回会话列表" hidden></button>
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><strong>AgentDeck</strong><span class="brand-caption">手机端</span></div>
      <div class="header-actions">
        <button id="refresh" class="icon-button" type="button" title="刷新" aria-label="刷新"></button>
        <button id="theme" class="icon-button" type="button" title="切换主题" aria-label="切换主题"></button>
      </div>
    </header>
    <main>
      <div class="view-heading"><div><p id="eyebrow" class="eyebrow">会话</p><h1 id="view-title">队长与队员</h1></div><span id="view-meta" class="view-meta"></span></div>
      <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
      <section id="sessions-view" aria-label="会话列表"><div id="sessions" class="session-list"></div></section>
      <section id="board-view" aria-label="任务看板" hidden><div id="projects"></div></section>
      <section id="output-view" aria-label="队员输出" hidden>
        <div class="output-toolbar"><span class="readonly-label">最新输出 · 只读</span><button id="copy" class="icon-button" type="button" title="复制输出" aria-label="复制输出"></button></div>
        <pre id="outputText" class="output" tabindex="0"></pre>
      </section>
      <section id="captain-view" aria-label="给队长发消息" hidden>
        <div id="captain-target" class="captain-target"></div>
        <form id="message-form" class="message-form">
          <label for="message">给队长的消息</label>
          <textarea id="message" name="message" rows="7" placeholder="写下你要队长处理的事…" required></textarea>
          <div class="composer-footer"><p>队长忙碌时，消息会等待送达。</p><button id="send" class="icon-button send-button" type="submit" title="给队长发送消息" aria-label="给队长发送消息" disabled></button></div>
        </form>
        <p id="send-status" class="send-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <nav class="navigation" aria-label="主导航">
      <button type="button" data-view="sessions" aria-current="page"><span class="nav-icon" aria-hidden="true"></span><span>会话</span></button>
      <button type="button" data-view="board"><span class="nav-icon" aria-hidden="true"></span><span>看板</span></button>
      <button type="button" data-view="captain"><span class="nav-icon" aria-hidden="true"></span><span>队长</span></button>
    </nav>
  </div>
</body>
</html>
