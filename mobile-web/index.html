<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark light">
  <title>AgentDeck</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="app" class="app">
    <header class="app-header">
      <button id="menu" class="icon-button" type="button" title="会话与设置" aria-label="打开会话列表" aria-controls="drawer" aria-expanded="false"></button>
      <button id="back" class="icon-button" type="button" title="返回队长对话" aria-label="返回队长对话" hidden></button>
      <div class="title-block">
        <span id="title-dot" class="dot" aria-hidden="true"></span>
        <div class="title-text"><h1 id="view-title">队长</h1><span id="view-meta" class="view-meta"></span></div>
      </div>
      <div class="header-actions">
        <button id="copy" class="icon-button" type="button" title="复制输出" aria-label="复制输出" hidden></button>
        <button id="refresh" class="icon-button" type="button" title="刷新" aria-label="刷新"></button>
      </div>
    </header>
    <div id="attention" class="attention" role="region" aria-label="等你处理" hidden></div>
    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
    <main class="views">
      <section id="captain-view" class="view" aria-label="队长对话">
        <div id="captain-turns" class="conversation" role="region" aria-label="最近队长对话" tabindex="0"></div>
      </section>
      <section id="output-view" class="view" aria-label="队员输出" hidden>
        <pre id="outputText" class="output" tabindex="0"></pre>
      </section>
      <section id="board-view" class="view board" aria-label="任务看板" hidden><div id="projects"></div></section>
    </main>
    <form id="message-form" class="composer">
      <p id="send-status" class="send-status" role="status" aria-live="polite"></p>
      <div class="composer-box">
        <textarea id="message" name="message" rows="1" maxlength="8000" aria-label="给队长的消息" placeholder="给队长发消息" required></textarea>
        <button id="send" class="icon-button send-button" type="submit" title="发送" aria-label="给队长发送消息" disabled></button>
      </div>
    </form>
    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <aside id="drawer" class="drawer" aria-label="会话与设置" hidden>
      <div class="drawer-head">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><strong>AgentDeck</strong></div>
        <button id="drawer-close" class="icon-button" type="button" title="关闭" aria-label="关闭会话列表"></button>
      </div>
      <nav class="drawer-body" aria-label="会话">
        <p class="drawer-label">会话 <span id="working-count"></span></p>
        <div id="sessions" class="session-list"></div>
        <p class="drawer-label">项目</p>
        <button id="open-board" class="session-row" type="button"><span class="row-icon" aria-hidden="true"></span><span class="row-main"><span class="row-title">任务看板</span><span class="row-sub">只读</span></span></button>
      </nav>
      <div class="drawer-foot">
        <button id="theme" class="icon-button" type="button" title="切换主题" aria-label="切换主题"></button>
        <button id="logout" class="icon-button" type="button" title="退出此设备" aria-label="退出此设备"></button>
      </div>
    </aside>
  </div>
</body>
</html>
