# /etc/ssh/sshd_config.d/agentdeck-tunnel-win.conf
# Windows 电脑的 AgentDeck 反向隧道专用账号：只允许把 VPS 本机 127.0.0.1:43123 转回 Windows，
# 没有 shell、没有其他转发。端口 43123 只属于这个账号，Mac 的账号只能用 43122（互相抢不了）。
# 授权公钥在 ~agentdeck-tunnel-win/.ssh/authorized_keys，同样带 restrict + permitlisten 限制，双重保险。
# 由 tunnel-account.sh create 安装；先 sshd -t 通过才会 reload。
Match User agentdeck-tunnel-win
	AuthenticationMethods publickey
	PasswordAuthentication no
	AllowTcpForwarding remote
	AllowStreamLocalForwarding no
	PermitListen 127.0.0.1:43123
	GatewayPorts no
	PermitTunnel no
	AllowAgentForwarding no
	X11Forwarding no
	PermitTTY no
	PermitUserRC no
	MaxSessions 0
	ClientAliveInterval 30
	ClientAliveCountMax 3
	ForceCommand /usr/sbin/nologin
